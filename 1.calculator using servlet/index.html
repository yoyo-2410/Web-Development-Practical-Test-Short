<!DOCTYPE html>
<html>
<head>
<title>Simple Calculator</title>
<style>
body{text-align:center;font-family:Arial;margin-top:100px}
.calculator{display:inline-block;padding:30px;border:1px solid #ccc}
input,select{padding:8px;margin:8px}
button{padding:8px 15px}
</style>
</head>

<body>
<div class="calculator">
<h2>Simple Calculator</h2>

<form action="calculatorservlet" method="post">
<input type="text" name="num1" placeholder="Enter first number" required><br>

<select name="operation">
<option value="add">+</option>
<option value="sub">-</option>
<option value="mul">*</option>
<option value="div">/</option>
</select><br>

<input type="text" name="num2" placeholder="Enter second number" required><br>

<button type="submit">Calculate</button>
</form>

</div>
</body>
</html>
